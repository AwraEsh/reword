name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev qt6-declarative-dev libhunspell-dev libatspi2.0-dev libx11-dev libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtquick-templates libqt6sql6-sqlite
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - name: Launch UI
        run: ./build/reword --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          REWORD_DATA_DIR: /tmp/reword-smoke
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt
        shell: pwsh
        run: |
          pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:RUNNER_TEMP/Qt"
          "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin" >> $env:GITHUB_PATH
      - name: Install Hunspell
        shell: pwsh
        run: vcpkg install hunspell:x64-windows --disable-metrics
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64" -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DREWORD_FCITX=OFF
      - run: cmake --build build --config Release --parallel 2
      - name: Tests
        shell: pwsh
        run: |
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
          $env:PATH="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - name: Bundle and create installer
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Reword-Windows
          path: dist/Reword-Setup-0.1.0.exe
