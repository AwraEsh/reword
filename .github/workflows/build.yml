name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      active_seconds:
        description: 'Packaged Linux active workload duration (0 skips it)'
        type: choice
        options: ['0', '120', '600', '7200']
        default: '0'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg cmake g++ qt6-base-dev qt6-declarative-dev libhunspell-dev libatspi2.0-dev at-spi2-core libx11-dev libxtst-dev libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtquick-shapes qml6-module-qtqml-workerscript qml6-module-qtquick-templates libqt6sql6-sqlite libgtk-3-dev xvfb xauth openbox x11-utils python3-gi dbus-x11
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          REWORD_UI_CAPTURE_DIR: ${{ github.workspace }}/dist/ui-review/pages
          REWORD_UI_CAPTURE_COMPACT: '1'
          REWORD_DIALOG_CAPTURE_DIR: ${{ github.workspace }}/dist/ui-review/dialogs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Reword-Linux-UI-Review
          path: dist/ui-review
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Reword-Linux-Test-Diagnostics
          path: |
            build/ui-test-results.xml
            build/service-test-results.xml
            build/fcitx-test-results.xml
            build/Testing/Temporary/LastTest.log
      - name: Reject a foreign-account recovery server
        run: sudo ./build/reword_recovery_tests crossAccountServerNeverReceivesGreeting
      - name: Launch UI
        run: ./build/reword --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          REWORD_DATA_DIR: /tmp/reword-smoke
      - name: Controlled native GTK probes
        run: python3 scripts/test-native-linux.py
      - name: Stage packaged application for active workload
        if: github.event_name == 'workflow_dispatch' && inputs.active_seconds != '0'
        run: |
          mkdir -p dist
          ./build/reword_performance_probe --passage-startup-profile > dist/passage-startup-profile.json
          /usr/lib/qt6/libexec/qmlimportscanner -rootPath "$PWD/qml" -importPath /usr/lib/x86_64-linux-gnu/qt6/qml > dist/qml-import-scan.json
          python3 scripts/package-linux.py
      - name: Short preflight before two-hour packaged workload
        if: github.event_name == 'workflow_dispatch' && inputs.active_seconds == '7200'
        run: |
          python3 scripts/test-native-linux.py --active-app "$PWD/dist/Reword.AppDir/AppRun" --active-seconds 120 --active-output "$PWD/dist/active-preflight"
      - name: Packaged active workload (hosted Ubuntu evidence)
        if: github.event_name == 'workflow_dispatch' && inputs.active_seconds != '0'
        env:
          ACTIVE_SECONDS: ${{ inputs.active_seconds }}
        run: |
          python3 scripts/test-native-linux.py --active-app "$PWD/dist/Reword.AppDir/AppRun" --active-seconds "$ACTIVE_SECONDS" --active-output "$PWD/dist/active-workload"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.active_seconds != '0'
        with:
          name: Reword-Hosted-Active-Workload
          path: |
            dist/active-workload
            dist/active-preflight
            dist/qml-import-scan.json
            dist/passage-startup-profile.json
            dist/Reword.AppDir/usr/share/reword/runtime-manifest.json
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        id: qt-cache
        with:
          path: ${{ runner.temp }}/Qt
          key: windows-2022-qt-6.8.3-msvc2022-v1
      - uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: windows-2022-hunspell-x64-v1
      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:RUNNER_TEMP/Qt"
      - name: Add Qt to PATH
        shell: pwsh
        run: '"$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin" >> $env:GITHUB_PATH'
      - name: Configure offscreen font lookup
        shell: pwsh
        run: |
          $rewordFontDirectory = Join-Path $env:WINDIR 'Fonts'
          if (!(Test-Path (Join-Path $rewordFontDirectory 'segoeui.ttf'))) {
            throw 'The Windows review runner is missing its system UI font.'
          }
          Add-Content -Path $env:GITHUB_ENV -Value "QT_QPA_FONTDIR=$rewordFontDirectory"
      - name: Install Hunspell
        shell: pwsh
        run: vcpkg install hunspell:x64-windows --disable-metrics
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64" -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DREWORD_FCITX=OFF
      - run: cmake --build build --config Release --parallel 2
      - name: Inspect native storage initialization
        shell: pwsh
        run: |
          foreach ($location in @($env:TEMP, $env:RUNNER_TEMP)) {
            $entry = Get-Item -LiteralPath $location
            while ($entry) {
              Write-Output ("Storage test ancestor: {0}; attributes: {1}; link type: {2}" -f $entry.FullName, $entry.Attributes, $entry.LinkType)
              $entry = $entry.Parent
            }
          }
          $env:PATH="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          $probe = Start-Process -FilePath ./build/Release/reword_storage_tests.exe -ArgumentList @('storageInitializationIsAvailable', '-v1', '-o', 'build/storage-initialization.txt,txt') -Wait -PassThru
          if (Test-Path build/storage-initialization.txt) { Get-Content build/storage-initialization.txt }
          if ($probe.ExitCode -ne 0) { throw ("Native storage initialization failed with exit code " + $probe.ExitCode) }
      - name: Tests
        shell: pwsh
        run: |
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
          $env:PATH="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          REWORD_UI_CAPTURE_DIR: ${{ github.workspace }}/dist/ui-review/pages
          REWORD_UI_CAPTURE_COMPACT: '1'
          REWORD_DIALOG_CAPTURE_DIR: ${{ github.workspace }}/dist/ui-review/dialogs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Reword-Windows-UI-Review
          path: dist/ui-review
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Reword-Windows-Test-Diagnostics
          path: |
            build/ui-test-results.xml
            build/service-test-results.xml
            build/Testing/Temporary/LastTest.log
      - name: Windows dependency metadata tests
        run: python -m unittest discover -s tests -p test_windows_pe_package.py -v
      - name: Bundle and create installer
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Reword-Windows-Materials-Audit
          path: dist/windows-materials
          if-no-files-found: error
      - name: Install, launch without developer dependencies, and uninstall
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Reword-Windows
          path: dist/Reword-Setup-0.1.0.exe
      - name: Native Windows field and shortcut probe
        shell: pwsh
        run: |
          $env:PATH="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          ./build/Release/reword_windows_native_probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows integration probe failed' }
